name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.5
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Android SDK (33/34)
        env:
          ANDROID_HOME: $ANDROID_HOME
        run: |
          mkdir -p "$ANDROID_HOME"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: $ANDROID_HOME
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xq-assist-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error