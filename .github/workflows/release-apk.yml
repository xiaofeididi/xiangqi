name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Calculate SHA-256
        working-directory: android/app/build/outputs/apk/debug
        id: sha256
        run: |
          echo "apk_sha256=$(sha256sum app-debug.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Resolve snapshot version
        if: github.ref == 'refs/heads/main'
        id: snapshot
        run: echo "version=v0.1.0-snapshot" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: xq-assist ${{ steps.version.outputs.version }}
          body: |
            xq-assist auto build.

            - Local play / browse
            - Pikafish hint
            - Overlay connect analysis
            - Live templates + lattice board fit
            SHA-256: ${{ steps.sha256.outputs.apk_sha256 }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create snapshot Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.snapshot.outputs.version }}
          name: xq-assist latest snapshot
          body: |
            Latest main build.
          files: android/app/build/outputs/apk/debug/app-debug.apk
