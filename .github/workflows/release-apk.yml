name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.5
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Android SDK (same as Build APK)
        env:
          ANDROID_HOME: $ANDROID_HOME
        run: |
          mkdir -p "$ANDROID_HOME"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1" >/dev/null

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: $ANDROID_HOME
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Calculate SHA-256
        working-directory: android/app/build/outputs/apk/debug
        id: sha256
        run: echo "apk_sha256=$(sha256sum app-debug.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: xq-assist ${{ steps.version.outputs.version }}
          body: |
            xq-assist auto build.

            - Overlay v0.5 UI (book enable, no mini board)
            - Engine/book download from Pro public API
            - SHA-256: ${{ steps.sha256.outputs.apk_sha256 }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
